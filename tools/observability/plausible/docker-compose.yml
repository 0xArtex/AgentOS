services:
  plausible_db:
    image: postgres:16-alpine
    container_name: palmyr-plausible-db
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plausible_db

  plausible_events_db:
    # Pinned to the version Plausible CE v3 was tested against. ClickHouse
    # 24.4+ changed the default-user auth behaviour and Plausible's connector
    # (which talks as `default` with no password) crashes with AUTHENTICATION_FAILED.
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: palmyr-plausible-events
    restart: unless-stopped
    # Hard container cap. The matching soft cap inside ClickHouse lives in
    # clickhouse-config.xml as <max_server_memory_usage> — without that
    # ClickHouse can OOM the cgroup before respecting the docker limit.
    mem_limit: 1g
    volumes:
      - event-data:/var/lib/clickhouse
      - ./clickhouse/clickhouse-config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./clickhouse/clickhouse-user-config.xml:/etc/clickhouse-server/users.d/logging.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  plausible:
    image: ghcr.io/plausible/community-edition:v3
    container_name: palmyr-plausible
    restart: unless-stopped
    mem_limit: 512m
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      - plausible_db
      - plausible_events_db
    # Bind to localhost only. Expose to the public via a Cloudflare Tunnel
    # (e.g. plausible.palmyr.ai → localhost:8000) — never directly.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env

volumes:
  db-data:
  event-data:
