name: Server

# The server suite has never gated a merge — CI ran a build for cli/** and a
# secret scan, and nothing else. Two TikTok regressions (an auth false-positive
# and a non-terminal post job) were each fixed WITH a test specifically so they
# could not recur, and nothing enforced them. This closes that.
on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch tells us nothing; cancel it and keep the
# queue honest.
concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      # Point the suite at a scratch directory so a run can never touch a real
      # database, and so tests that write are isolated from each other's state.
      # `github.workspace`, not `runner.temp` — the runner context is not
      # available in job-level env, and using it there makes the whole workflow
      # file invalid rather than failing loudly at the step.
      PALMYR_DATA_DIR: ${{ github.workspace }}/.palmyr-test-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Prepare isolated data directory
        run: mkdir -p "$PALMYR_DATA_DIR"

      - name: Test
        run: npm test
