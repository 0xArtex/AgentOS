<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discover — Palmyr</title>
    <meta
      name="description"
      content="Browse every tool your AI agent can use. Phone numbers, email inboxes, compute, domains, social accounts, and more — priced in USDC over x402, no API keys."
    />
    <script defer data-domain="palmyr.ai" src="https://plausible.palmyr.ai/js/script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/discovery/bg.webp"
      fetchpriority="high"
    />
    <style>
      /* Inline so it applies before the bundled CSS arrives — kills the
         brief flash before the body's `background` rule loads. */
      html, body { background: #112d32; }
    </style>
    <script type="module" crossorigin src="/discovery/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/discovery/assets/index.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
