<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-label="Palmyr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2228"/>
      <stop offset="0.5" stop-color="#112d32"/>
      <stop offset="1" stop-color="#0a1b1f"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#193d44" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#112d32" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3e6c4"/>
      <stop offset="0.35" stop-color="#a89774"/>
      <stop offset="1" stop-color="#a89774" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldSoft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a89774" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a89774" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traj" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a89774" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cdbb92"/>
      <stop offset="1" stop-color="#a89774" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <style>
    @keyframes tw { 0%, 100% { opacity: 0.22 } 50% { opacity: 0.85 } }
    @keyframes pl { 0%, 100% { opacity: 0.42 } 50% { opacity: 0.64 } }
    @keyframes cr { 0%, 100% { opacity: 0.65 } 50% { opacity: 1 } }
    @media (prefers-reduced-motion: no-preference) {
      .g { animation: pl 7s ease-in-out infinite }
      .c { animation: cr 4.5s ease-in-out infinite }
      .s1 { animation: tw 4s ease-in-out infinite }
      .s2 { animation: tw 5.5s ease-in-out infinite -1.5s }
      .s3 { animation: tw 6.5s ease-in-out infinite -3s }
      .s4 { animation: tw 5s ease-in-out infinite -2.2s }
    }
  </style>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)"/>
  <rect width="1200" height="420" fill="url(#centerGlow)"/>

  <circle cx="1030" cy="60" r="230" fill="url(#goldSoft)" opacity="0.22"/>

  <g transform="translate(205 332)" stroke="#a89774" fill="none">
    <ellipse rx="70" ry="26" opacity="0.32"/>
    <ellipse rx="122" ry="45" opacity="0.22"/>
    <ellipse rx="182" ry="67" opacity="0.15"/>
    <ellipse rx="252" ry="93" opacity="0.10"/>
    <ellipse rx="334" ry="122" opacity="0.06"/>
  </g>
  <circle class="g" cx="205" cy="332" r="125" fill="url(#gold)" opacity="0.55"/>
  <circle class="c" cx="205" cy="332" r="4.5" fill="#f6ecd2"/>

  <circle cx="327" cy="314" r="2.6" fill="#e9d8ad"/>
  <circle cx="58" cy="358" r="2.2" fill="#cdbb92"/>
  <circle cx="404" cy="360" r="2" fill="#a89774"/>

  <path d="M150 252 C 270 60, 560 30, 884 122" stroke="url(#traj)" stroke-width="1.4" opacity="0.7"/>
  <circle cx="150" cy="252" r="3.2" fill="#e9d8ad"/>
  <circle class="s1" cx="512" cy="55" r="2.6" fill="#f3e6c4"/>
  <circle class="s3" cx="884" cy="122" r="3" fill="#cdbb92"/>

  <g fill="#ffffff">
    <circle cx="760" cy="70" r="1.1" opacity="0.5"/>
    <circle class="s2" cx="980" cy="180" r="1.4" opacity="0.6"/>
    <circle cx="1100" cy="300" r="1" opacity="0.4"/>
    <circle class="s1" cx="650" cy="330" r="1.2" opacity="0.42"/>
    <circle cx="900" cy="360" r="1" opacity="0.35"/>
    <circle cx="1044" cy="382" r="1.3" opacity="0.5"/>
    <circle cx="720" cy="250" r="0.9" opacity="0.3"/>
    <circle class="s4" cx="1140" cy="120" r="1" opacity="0.4"/>
  </g>
  <g fill="#a89774">
    <circle class="s3" cx="600" cy="120" r="1.4" opacity="0.7"/>
    <circle cx="840" cy="280" r="1.2" opacity="0.6"/>
    <circle class="s2" cx="1082" cy="240" r="1.5" opacity="0.55"/>
  </g>

  <g stroke="#ffffff" stroke-width="1" opacity="0.16">
    <path d="M70 68 h10 M75 63 v10"/>
    <path d="M1132 360 h10 M1137 355 v10"/>
    <path d="M560 360 h8 M564 356 v8"/>
    <path d="M980 58 h8 M984 54 v8"/>
  </g>
</svg>
